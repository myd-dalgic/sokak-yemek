 for(let i=0;i<8;i++)mk(BX(2.8,.05,.09),steel,0,.6,-1.4+i*.24,g);

mkSt('İçecek',g=>{
 mk(BX(4.2,3,.2),mat(0x20262c,.5,.6),0,1.6,-2.7,g);
 for(let i=0;i<3;i++){mk(BX(4,.05,1),steel,0,.8+i*.9,-2.2,g);for(let j=0;j<4;j++)mk(CY(.2,.2,.7,16),mat([0xf4f0e6,0x6b1d4f,0x7fc4e6][(i+j)%3],.3),-1.4+j*.9,1.2+i*.9,-2.2,g)}
 const L=new T.PointLight(0xbfe6ff,.9,6);L.position.set(0,2,-1.6);g.add(L);
 const gl=[[-.5,0xf4f0e6,1],[1.2,0x7a1a58,0]].map(([x,c,f])=>{mk(CY(.45,.38,1.1,24,true),mat(0xcfe8f5,.05,0,{transparent:true,opacity:.28,side:T.DoubleSide}),x,.6,.6,g);const liq=mk(CY(.4,.35,1,24),mat(c,.15),x,.06,.6,g);liq.visible=false;let foam=null;if(f){foam=mk(CY(.41,.41,.18,24),mat(0xfffaf0,.9),x,.6,.6,g);foam.visible=false}return{x,liq,foam,c}});
 const bot=mk(CY(.32,.32,1.2,20),mat(0xf4f0e6,.3),0,3.1,.6,g),str=mk(CY(.05,.05,1,8),mat(0xf4f0e6,.2),0,2,.6,g);str.visible=false;
 function pour(i,p){const o=gl[i];o.liq.visible=p>0;o.liq.scale.y=Math.max(.001,.95*p);o.liq.position.y=.06+.475*p;if(o.foam){o.foam.visible=p>.05;const hf=.04+.14*p;o.foam.scale.y=hf/.18;o.foam.position.y=.06+.95*p+hf/2}}
 const vf=p=>['bandpass',500+p*2400,3,.18*(.8+.2*Math.sin(performance.now()/28))];
 return{u(dt,act){const s=ST[4],i=Math.min(s.i,1),o=gl[i],p=s.steps[i].p;bot.visible=!s.done;bot.position.set(o.x+.9,3.1,.6);bot.rotation.z=1.9;bot.material.color.set(o.c);str.material.color.set(o.c);str.visible=act&&!s.done;const top=.06+.95*p;str.position.set(o.x,(2.9+top)/2,.6);str.scale.y=2.9-top},
 steps:[{t:'Yayık ayranı dök',h:'Basılı tut; köpük yükselir',m:'h',k:3.2,v:vf,f:p=>pour(0,p)},{t:'Şalgamı doldur',h:'Basılı tut',m:'h',k:3.2,v:vf,f:p=>pour(1,p)}]}});
/* ---------- VR layer: hands, HUD, locomotion, customers ---------- */
let cur=0,lock=0,mode=0,t0=performance.now(),fr=0,lH=0,pk=0,sn=0,mx=0,my=0,nxt=2;
const V3=new T.Vector3(),V4=new T.Vector3(),CP=new T.Vector3(),keys={},hands=[],clp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hap=(v,ms,h)=>(h?[h]:hands).forEach(q=>{const a=q.gp&&q.gp.hapticActuators;if(a&&a[0])try{a[0].pulse(v,ms)}catch(e){}});
function mkGlove(){const g=new T.Group();mk(SP(.07,12),glove,0,0,0,g).scale.set(1,.8,1.2);for(let i=0;i<4;i++)mk(CY(.015,.014,.08,8),glove,-.035+i*.024,.008,-.07,g).rotation.x=Math.PI/2.4;return g}
function mkHand(i){const v=i>1,c=v?new T.Group():R.xr.getController(i),h={c,trig:0,lp:new T.Vector3(),dl:new T.Vector3(),pos:new T.Vector3(),gp:null,hd:''};c.add(mkGlove());rig.add(c);
 if(!v){c.addEventListener('selectstart',()=>{h.trig=1;lock=0});c.addEventListener('selectend',()=>h.trig=0);
  c.addEventListener('connected',e=>{h.gp=e.data.gamepad;h.hd=e.data.handedness;if(h.hd=='right'||(!h.hd&&i==1))tools.forEach(t=>t&&c.add(t))})}
 hands.push(h)}
[0,1,2].forEach(mkHand);
/* HUD canvases */
const rr=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()};
function lab(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return{t,draw:(...a)=>{g.clearRect(0,0,w,h);draw(g,w,h,...a);t.needsUpdate=true}}}
function sprite(draw,w,h,sw,sh){const L=lab(w,h,draw);L.draw();const q=new T.Sprite(new T.SpriteMaterial({map:L.t}));q.scale.set(sw,sh,1);return q}
const pan=[],btn=[];
ST.forEach((s,i)=>{const L=lab(640,176,(g,w,h,tx,hn,pr)=>{g.fillStyle='rgba(28,16,9,.88)';rr(g,0,0,w,h,26);g.fillStyle='#f6e7d0';g.font='bold 31px system-ui';g.fillText(tx,26,58);g.fillStyle='#d9c3a5';g.font='23px system-ui';g.fillText(hn,26,98);g.fillStyle='#0008';g.fillRect(26,128,w-52,14);g.fillStyle='#ff9a3c';g.fillRect(26,128,(w-52)*pr,14)});
 const p=mk(new T.PlaneGeometry(4.2,1.15),new T.MeshBasicMaterial({map:L.t,transparent:true}),0,4.6,-1,s.g);p.castShadow=false;p.userData={L,k:''};pan.push(p);
 const b=mk(CY(.55,.6,.24,24),mat(0x555555,.4),0,.12,2,s.g);btn.push(b);
 const L2=lab(256,128,(g,w)=>{g.fillStyle='#fff';g.font='bold 54px system-ui';g.textAlign='center';g.fillText('SERVİS',w/2,80)});L2.draw();
 const l=mk(new T.PlaneGeometry(1,.5),new T.MeshBasicMaterial({map:L2.t,transparent:true}),0,.26,0,b);l.rotation.x=-Math.PI/2;l.castShadow=false});
function ui(){ST.forEach((s,i)=>{const x=s.steps[s.i],tx=s.done?'Hazır! Servis düğmesine dokun':x.t,hn=s.done?'Müşteri bekliyor':'Tetik: '+(x.h||''),pr=s.steps.reduce((a,y)=>a+y.p,0)/s.steps.length,k=tx+hn+Math.round(pr*40),p=pan[i];if(p.userData.k!=k){p.userData.k=k;p.userData.L.draw(tx,hn,pr)}btn[i].material.color.set(s.done?0x3fbf5a:0x555555);btn[i].material.emissive.set(s.done?0x1f7a35:0)})}
/* customers (NPC state machine: 0 walk in, 1 order+wait, 3 eat, 4 leave) */
const MENU=['Yarım ekmek döner, bol et olsun!','Çift kaşarlı tost lütfen!','Bol acılı mercimek çorbası!','Nohutlu tavuklu pilav, karabiberli!','Yayık ayran, köpüklü olsun!'],HI=['Kolay gelsin usta!','Selamlar usta!','Eline sağlık usta!'],busy=[],cust=[],coins=[],cm=mat(0xffc13a,.25,.9);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.pitch=.7+Math.random()*.7;speechSynthesis.speak(u)}catch(e){}};
const crunch=()=>{burst('highpass',2500,.8,.35,.05);burst('bandpass',900,4,.25,.09);tone(180,.1,.06,'triangle',90)};
function bubble(txt){const w=txt.split(' '),m=Math.ceil(w.length/2),l=[w.slice(0,m).join(' '),w.slice(m).join(' ')];return sprite((g,W,H)=>{g.fillStyle='#fffaf0';rr(g,0,0,W,H,34);g.fillStyle='#2a1708';g.font='bold 38px system-ui';g.textAlign='center';g.fillText(l[0],W/2,78);g.fillText(l[1],W/2,138)},640,190,4.4,1.3)}
function person(){const g=new T.Group(),sk=[0xf1c9a5,0xd9a47c,0xa86f47,0x7b4a2a][Math.floor(Math.random()*4)],sh=mat(new T.Color().setHSL(Math.random(),.5,.45),.8),lm=mat(0x23262b,.8),sm=mat(sk,.7);
 g.legs=[-.22,.22].map(x=>{const l=new T.Group();l.position.set(x,1.7,0);mk(CY(.17,.15,1.7,10),lm,0,-.85,0,l);g.add(l);return l});
 mk(CY(.5,.42,1.4,14),sh,0,2.4,0,g);mk(SP(.38,14),sm,0,3.4,0,g);mk(new T.SphereGeometry(.4,14,8,0,6.283,0,1.4),mat(0x2b1a10,.9),0,3.45,-.03,g);
 [-.14,.14].forEach(x=>mk(SP(.05,6),mat(0x111111),x,3.42,.34,g));
 g.arms=[-.62,.62].map(x=>{const a=new T.Group();a.position.set(x,2.95,0);mk(CY(.13,.11,1.2,8),sh,0,-.55,0,a);g.add(a);return a});return g}
function spawn(){const f=[0,1,2,3,4].filter(i=>!busy[i]);if(!f.length||cust.length>=3)return;const i=f[Math.floor(Math.random()*f.length)],g=person(),d=Math.random()<.5?-1:1;busy[i]=1;g.position.set(d<0?-14:46,-1.98,-6.5);S.add(g);cust.push({g,i,s:0,t:0,d,tx:ST[i].g.position.x+4.1,b:null,e:null})}
function updC(dt){cust.slice().forEach(c=>{const g=c.g;c.t+=dt;
 const sw=a=>{g.legs[0].rotation.x=Math.sin(c.t*8)*a;g.legs[1].rotation.x=-Math.sin(c.t*8)*a;g.arms[0].rotation.x=-Math.sin(c.t*8)*a;g.arms[1].rotation.x=Math.sin(c.t*8)*a},
 go=(x,z,v)=>{const dx=x-g.position.x,dz=z-g.position.z,L=Math.hypot(dx,dz);if(L<.15)return 1;g.position.x+=dx/L*v*dt;g.position.z+=dz/L*v*dt;g.rotation.y=Math.atan2(dx,dz);sw(.6);return 0};
 if(c.s==0){if(go(c.tx,-3.4,3.2)){c.s=1;c.t=0;g.rotation.y=0;sw(0);c.b=bubble(MENU[c.i]);c.b.position.y=4.7;g.add(c.b);say(HI[Math.floor(Math.random()*3)]+' '+MENU[c.i])}}
 else if(c.s==1){g.rotation.y=Math.sin(c.t*.7)*.35;g.arms[1].rotation.x=Math.sin(c.t*2)*.08;if(Math.random()<dt*.15)tone(1400,.04,.35,'sine',1000)}
 else if(c.s==3){g.rotation.y=0;g.arms[1].rotation.x=-1.2+Math.sin(c.t*10)*.2;if(c.t>2.8){c.s=4;c.t=0;g.remove(c.e);g.arms[1].rotation.x=0}}
 else if(c.s==4){g.arms[1].rotation.z=c.t<.9?2.4+Math.sin(c.t*14)*.3:0;if(go(c.d<0?48:-16,-6.5,3.2)){S.remove(g);busy[c.i]=0;cust.splice(cust.indexOf(c),1)}}})}
function serve(i){const s=ST[i];if(!s.done)return;chime();hap(1,120);const c=cust.find(c=>c.i==i&&c.s==1);
 if(c){c.s=3;c.t=0;c.g.remove(c.b);c.e=sprite((g,W)=>{g.font='96px serif';g.textAlign='center';g.fillText('😍',W/2,100)},128,128,1.4,1.4);c.e.position.y=4.5;c.g.add(c.e);
  for(let k=0;k<5;k++)setTimeout(crunch,500+k*300);
  for(let k=0;k<4;k++){const m=mk(CY(.14,.14,.03,16),cm,c.g.position.x+(Math.random()-.5)*.8,2.2+k*.3,-1.9+(Math.random()-.5)*.4);m.v=0;coins.push(m);if(coins.length>24)S.remove(coins.shift())}}
 s.reset()}
/* locomotion: left stick walk, right stick snap-turn */
function loco(dt){let f=0,st=0,tu=0;hands.forEach(h=>{const a=h.gp&&h.gp.axes;if(!a)return;if(h.hd=='left'){st=a[2]||0;f=-(a[3]||0)}else tu=a[2]||0});
 if(mode==2){f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);st=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)}
 if(Math.abs(f)<.15)f=0;if(Math.abs(st)<.15)st=0;
 if(f||st){C.getWorldDirection(V3);V3.y=0;V3.normalize();rig.position.x+=(V3.x*f-V3.z*st)*3.4*dt;rig.position.z+=(V3.z*f+V3.x*st)*3.4*dt}
 if(Math.abs(tu)>.7){if(!sn){sn=1;C.getWorldPosition(V3);rig.rotation.y-=Math.sign(tu)*Math.PI/6;rig.updateMatrixWorld(true);C.getWorldPosition(V4);rig.position.x+=V3.x-V4.x;rig.position.z+=V3.z-V4.z}}else sn=0;
 rig.position.x=clp(rig.position.x,-6,ST.length*8-2);rig.position.z=clp(rig.position.z,3.2,7.5)}
/* main loop */
function tick(now){const dt=Math.min((now-t0)/1000,.05);t0=now;
 C.getWorldPosition(CP);cur=clp(Math.round(CP.x/8),0,4);
 const vh=hands[2];vh.c.visible=mode==2;if(mode==2)vh.c.position.set(mx*1.1,1.15+my*.4,-.55);else vh.trig=0;
 hands.forEach(h=>{h.c.getWorldPosition(h.pos);h.dl.copy(h.c.position).sub(h.lp).multiplyScalar(2.2);h.lp.copy(h.c.position)});
 loco(dt);
 const s=ST[cur],x=s.steps[s.i];let act=false,ah=null;
 if(!s.done&&!lock){ah=hands.find(h=>h.trig&&h.c.visible&&Math.abs(h.pos.x-s.g.position.x)<3.4&&h.pos.y>-.3);
  if(ah){if(x.m=='h'){x.p=Math.min(1,x.p+dt/x.k);x.f(x.p,dt/x.k,0);act=true}
   else{const dist=x.dir?Math.max(-ah.dl.y,0):ah.dl.length(),d=dist/1.6;if(d>.0006){const dp=d/x.k;x.p=Math.min(1,x.p+dp);x.f(x.p,dp,d/dt,0);act=true}}}}
 if(!s.done&&x.p>=1&&!x.d){x.d=1;lock=1;ding();hap(.8,100,ah);if(s.i<s.steps.length-1)s.i++;else s.done=1}
 if(act&&ah&&now-lH>90){lH=now;hap(.2,35,ah)}
 if(A){const v=act&&x.v?x.v(x.p):null;if(v){hv.fl.type=v[0];hv.fl.frequency.setTargetAtTime(v[1],A.currentTime,.05);hv.fl.Q.value=v[2]}
  hv.g.gain.setTargetAtTime(v?v[3]:0,A.currentTime,.04);sz.g.gain.setTargetAtTime(amb.siz*.1,A.currentTime,.2);if(Math.random()<dt*amb.siz*40)burst('highpass',6000,1,.12*amb.siz,.015)}
 amb.siz=0;ST.forEach((q,i)=>q.u(dt,i==cur&&act));
 stm.forEach(p=>{const d=p.userData,a=p.geometry.attributes.position;for(let i=0;i<d.n;i++){const ph=(i/d.n+now*.00012)%1;a.setXYZ(i,d.x+Math.sin(ph*6+i)*.25*ph,d.y+ph*1.8,d.z+Math.cos(i)*.2)}a.needsUpdate=true});
 tools.forEach((t,i)=>t&&(t.visible=i==cur));
 btn.forEach((b,i)=>{if(!ST[i].done||now-pk<800)return;b.getWorldPosition(V4);V4.y+=.3;hands.forEach(h=>{if(h.c.visible&&h.pos.distanceTo(V4)<.8){pk=now;serve(i)}})});
 nxt-=dt;if(nxt<=0){spawn();nxt=6+Math.random()*6}updC(dt);
 coins.forEach(m=>{if(m.v!=null){m.v-=14*dt;m.position.y+=m.v*dt;if(m.position.y<=.03){m.position.y=.03;m.v=null;tone(2600+Math.random()*600,.05,.2,'sine',1900)}}});
 pan.forEach(p=>{p.getWorldPosition(V4);p.rotation.y=Math.atan2(CP.x-V4.x,CP.z-V4.z)});
 sp.position.set(CP.x,9,5);sp.target.position.set(CP.x,0,0);
 if(fr++%6==0)ui();R.render(S,C)}
/* start buttons, input fallback */
const go=()=>{if(!A)ai()};
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{$('#vr').disabled=!ok;if(!ok)$('#mp').textContent='Bu cihazda VR bulunamadı. Meta Quest Tarayıcı ile aç ya da masaüstü önizlemeyi dene.'});else $('#mp').textContent='WebXR için sayfa HTTPS üzerinden açılmalı (GitHub Pages uygundur). Önizleme için masaüstü modunu kullanabilirsin.';
$('#vr').onclick=async()=>{go();try{const se=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});R.xr.setSession(se);mode=1;$('#m').style.display='none';se.addEventListener('end',()=>{mode=0;$('#m').style.display='flex'})}catch(e){$('#mp').textContent='VR başlatılamadı: '+e.message}};
$('#dk').onclick=()=>{go();mode=2;$('#m').style.display='none';tools.forEach(t=>t&&hands[2].c.add(t));C.rotation.x=-.3};
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1)});
addEventListener('pointerdown',()=>{if(mode==2){hands[2].trig=1;lock=0}});addEventListener('pointerup',()=>hands[2].trig=0);
